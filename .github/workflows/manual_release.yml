name: Manual Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Calculate next version
        id: next
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          CURRENT=$(jq -r '.version' package.json)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEXT="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT → $NEXT ($BUMP)"

      - name: Update version
        env:
          NEXT: ${{ steps.next.outputs.version }}
        run: |
          jq --arg v "$NEXT" '.version = $v' package.json > tmp.json && mv tmp.json package.json
          echo "Updated package.json → $NEXT"

      - name: Generate release notes
        run: |
          bash .github/scripts/generate-notes.sh HEAD > /tmp/release-notes.md

      - name: Update changelog
        env:
          NEXT: ${{ steps.next.outputs.version }}
        run: bash .github/scripts/update-changelog.sh "$NEXT" /tmp/release-notes.md

      - name: Commit, tag, and push
        env:
          NEXT: ${{ steps.next.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          git commit -m "release: v${NEXT}"
          git tag "v${NEXT}"
          git push origin HEAD --tags

      - name: Build artifacts
        run: |
          for SKILL_DIR in skills/*/; do
            SKILL_NAME=$(basename "$SKILL_DIR")
            echo "Building $SKILL_NAME.zip..."
            (cd skills && zip -r "$GITHUB_WORKSPACE/${SKILL_NAME}.zip" "$SKILL_NAME/")
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NEXT: ${{ steps.next.outputs.version }}
        run: |
          ARTIFACTS=$(find . -maxdepth 1 -name '*.zip' -print)
          gh release create "v${NEXT}" $ARTIFACTS \
            --title "v${NEXT}" \
            --notes-file /tmp/release-notes.md
